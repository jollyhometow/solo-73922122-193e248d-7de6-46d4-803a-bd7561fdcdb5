services:
  matching-api:
    build: .
    image: lab-matching-api:latest
    container_name: lab-matching-api
    ports:
      - "8000:8000"
    environment:
      RUNS_DB_PATH: /srv/app/data/runs.db
    volumes:
      - runs-data:/srv/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  runs-data:
